name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per pull request, so a new push supersedes
  # the one in flight. Every other run is keyed by its run id: GitHub keeps at
  # most one pending run per group, so sharing a group would drop a queued
  # push-to-main run even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # LINUX_RUNNER_LABELS is an org variable holding a JSON array of self-hosted runner labels.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 14 successful runs: at most 0.1 min of running time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid org license; the gitleaks binary
      # itself is MIT-licensed and free. Install the release binary for the
      # runner's architecture into a job-scoped directory (no root needed),
      # verify its published checksum, and run it directly.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          case "$(uname -m)" in
            x86_64) GITLEAKS_ARCH=x64 ;;
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          INSTALL_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${INSTALL_DIR}"
          cd "${INSTALL_DIR}"
          curl -sSfL -O "${BASE_URL}/${ASSET}"
          curl -sSfL -O "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ASSET}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  private-paths:
    # LINUX_RUNNER_LABELS is an org variable holding a JSON array of self-hosted runner labels.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            RG_VERSION=14.1.1
            case "$(uname -m)" in
              x86_64) RG_ARCH=x86_64-unknown-linux-musl ;;
              aarch64|arm64) RG_ARCH=aarch64-unknown-linux-gnu ;;
              *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            ASSET="ripgrep-${RG_VERSION}-${RG_ARCH}.tar.gz"
            BASE_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
            INSTALL_DIR="${RUNNER_TEMP}/ripgrep"
            mkdir -p "${INSTALL_DIR}"
            cd "${INSTALL_DIR}"
            curl -sSfL -O "${BASE_URL}/${ASSET}"
            curl -sSfL -O "${BASE_URL}/${ASSET}.sha256"
            sha256sum -c "${ASSET}.sha256"
            tar -xzf "${ASSET}"
            echo "${INSTALL_DIR}/ripgrep-${RG_VERSION}-${RG_ARCH}" >> "$GITHUB_PATH"
            export PATH="${INSTALL_DIR}/ripgrep-${RG_VERSION}-${RG_ARCH}:$PATH"
          fi
          rg --version

      - name: Check no private paths or identifiers
        run: ./scripts/check-no-private-paths.sh
